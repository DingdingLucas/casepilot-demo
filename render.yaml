services:
  - type: web
    name: casepilot-demo
    runtime: python
    plan: starter            # $7/mo — always on, no cold sleeps (free plan sleeps after 15 min idle)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 300 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set in the Render dashboard — never committed to git
      - key: DEMO_PASSWORD
        sync: false          # shared password investors use to open the site
      - key: WARM_CACHE
        value: "1"           # keeps the prompt cache hot (~$0.50/day) so queries are never slow
